<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>vamo ap porra</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .text-content {
      max-width: 600px;
      width: 100%;
      pointer-events: auto;
    }

    .text-content h1 {
      font-size: clamp(2.5rem, 10vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 1px;
      color: #c084fc;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(192, 132, 252, 0.4), 0 0 40px rgba(147, 51, 234, 0.3);
      word-break: break-word;
      line-height: 1.1;
    }

    /* CSS dos botões vai AQUI dentro do <style> */
    .btn-primary:hover {
      background: #a855f7;
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.7);
    }

    .btn-secondary {
      background: #ffffff;
      color: #581c87;
      border: 2px solid #a855f7;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      transition: transform 0.2s, background 0.3s, color 0.3s, box-shadow 0.2s;
    }
  </style>
</head>
<body>

  <div class="text-content">
    <h1>vamo ap hoje?</h1>
    <button class="btn-primary">entra discord</button>
    <button class="btn-secondary">nao</button>
  </div>

</body>
</html>
