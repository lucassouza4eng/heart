<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>vamo ap porra</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .text-content {
      max-width: 600px;
      width: 100%;
      pointer-events: auto;
    }

    .text-content h1 {
      font-size: clamp(2.5rem, 10vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 1px;
      color: #c084fc;
      margin-bottom: 15px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(192, 132, 252, 0.4), 0 0 40px rgba(147, 51, 234, 0.3);
      word-break: break-word;
      line-height: 1.1;
    }
  </style>
</head>
<body>

  <div class="text-content">
    <h1>Vamo ap hoje</h1>
  </div>

</body>
</html>
