<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE - Sandbox de Corações</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8f5ff 0%, #ede9fe 100%);
            color: #2e1065;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            filter: blur(1px);
            transition: filter 0.3s ease;
        }

        #particle-canvas:hover {
            filter: blur(0px);
        }

        .hero-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 0 8%;
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .text-content {
            max-width: 600px;
            pointer-events: auto;
        }

        .text-content h1 {
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #6d28d9;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(109, 40, 217, 0.15);
        }

        .text-content p {
            color: #5b21b6;
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .btn-primary {
            background: #8b5cf6;
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
            transition: transform 0.3s, background 0.3s;
        }

        .btn-primary:hover {
            background: #7c3aed;
            transform: translateY(-3px);
        }

        .content-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            padding: 0 8%;
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            padding: 40px;
            border-radius: 24px;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(109, 40, 217, 0.08);
            pointer-events: auto;
        }

        .card h2 {
            color: #6d28d9;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .card p {
            color: #4c1d95;
            line-height: 1.6;
        }

        .reveal {
            opacity: 0;
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0) translateX(0) !important;
        }

        .float-left {
            transform: translateX(-100px);
        }

        .float-right {
            transform: translateX(100px);
            margin-left: auto;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <section id="home" class="hero-section">
        <div class="text-content reveal active">
            <h1 id="hero-title">TESTE</h1>
            <p>Arraste o dedo ou o cursor para abrir caminho em meio à tempestade de corações!</p>
            <button class="btn-primary">Clique aqui ↗</button>
        </div>
    </section>

    <section id="sobre" class="content-section">
        <div class="card reveal float-left">
            <h2>Alta Densidade</h2>
            <p>Centenas de partículas renderizadas simultaneamente para criar um efeito visual dinâmico e preenchido.</p>
        </div>
    </section>

    <section id="servicos" class="content-section">
        <div class="card reveal float-right">
            <h2>Física de Partículas</h2>
            <p>Efeito de onda e dispersão responsivo ao menor toque na tela.</p>
        </div>
    </section>

    <script>
        window.addEventListener('scroll', () => {
            const reveals = document.querySelectorAll('.reveal');
            const scrollPos = window.scrollY;

            reveals.forEach(el => {
                const windowHeight = window.innerHeight;
                const elementTop = el.getBoundingClientRect().top;
                if (elementTop < windowHeight - 100) {
                    el.classList.add('active');
                }
            });

            const heroTitle = document.getElementById('hero-title');
            if (heroTitle) {
                heroTitle.style.transform = `translateX(${scrollPos * 0.12}px)`;
            }
        });

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const mouse = { x: -1000, y: -1000, radius: 180 };

        function updateMousePos(x, y) {
            mouse.x = x;
            mouse.y = y;
        }

        window.addEventListener('mousemove', (e) => updateMousePos(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
        window.addEventListener('mouseleave', () => updateMousePos(-1000, -1000));

        function drawHeart(ctx, x, y, size, color, opacity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.globalAlpha = opacity;
            ctx.fillStyle = color;

            const topCurveHeight = size * 0.3;
            ctx.moveTo(0, topCurveHeight);
            ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
            ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, size, 0, size);
            ctx.bezierCurveTo(0, size, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
            ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
            
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        const colors = ['#8b5cf6', '#a855f7', '#c084fc', '#d8b4fe', '#7c3aed', '#6d28d9'];

        class HeartParticle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 20;
                this.size = Math.random() * 10 + 6;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = -Math.random() * 0.9 - 0.3;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.65 + 0.25;
                this.density = Math.random() * 25 + 10;
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < mouse.radius) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const maxDistance = mouse.radius;
                    const force = (maxDistance - distance) / maxDistance;
                    const directionX = forceDirectionX * force * this.density;
                    const directionY = forceDirectionY * force * this.density;

                    this.x -= directionX;
                    this.y -= directionY;
                }

                if (this.y < -20 || this.x < -20 || this.x > width + 20) {
                    this.reset(false);
                }
            }

            draw() {
                drawHeart(ctx, this.x, this.y, this.size, this.color, this.opacity);
            }
        }

        // Quantidade aumentada para 350 corações
        const heartCount = 350;
        const hearts = [];
        for (let i = 0; i < heartCount; i++) {
            hearts.push(new HeartParticle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            hearts.forEach(heart => {
                heart.update();
                heart.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
